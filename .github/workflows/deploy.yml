name: Deploy (test)

# Builds the site with OpenNext and deploys it to the test Worker `test-docs`
# (top level of wrangler.jsonc), served at website-test.sentio.xyz/docs, on every push to main.
# Production is released manually by deploy-production.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two test deploys at once; a newer push cancels the one still running
concurrency:
  group: deploy-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: test
      url: https://website-test.sentio.xyz/docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and deploy
        run: npm run deploy
        env:
          # Inlined at build time (metadataBase, OG image URLs)
          NEXT_PUBLIC_SITE_URL: https://website-test.sentio.xyz
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
