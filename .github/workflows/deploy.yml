name: Deploy

# Builds the site with OpenNext and deploys it to a Cloudflare Worker (see wrangler.jsonc):
# - test: every push to main -> `test-docs`, served at website-test.sentio.xyz/docs
# - production: manual run -> `sentio-docs`, served at www.sentio.xyz/docs
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [test, production]
        default: test

# Never run two deploys to the same environment at once; a newer run cancels the one still running
concurrency:
  group: deploy-${{ inputs.environment || 'test' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.environment || 'test' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and deploy
        # The site URL is inlined at build time (metadataBase, OG images), so each environment builds separately
        run: |
          if [ "$TARGET" = production ]; then
            export NEXT_PUBLIC_SITE_URL=https://www.sentio.xyz
            npm run deploy:production
          else
            export NEXT_PUBLIC_SITE_URL=https://website-test.sentio.xyz
            npm run deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
